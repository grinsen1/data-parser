<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0d0e">
<title>Domains Parser v4</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0d0e;color:#f5f5f5;padding:16px}
  .container{max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#9d9da3;margin:0 0 16px;font-size:13px}
  .card{background:#19191b;border-radius:12px;padding:16px;margin-bottom:16px}
  textarea{width:100%;background:#242426;color:#f5f5f5;border:none;border-radius:8px;padding:12px;font-family:monospace;font-size:13px;resize:vertical}
  button{padding:8px 16px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:600}
  .btn-primary{background:#f7bd19;color:#000}
  .btn-secondary{background:#242426;color:#f5f5f5}
  .btn-danger{background:#e53935;color:#fff}
  button:disabled{opacity:.4}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:#9d9da3;font-size:12px;padding:8px 6px;border-bottom:1px solid #2a2a2c}
  td{padding:8px 6px;border-bottom:1px solid #1a1a1c;font-size:13px;vertical-align:middle}
  .tier{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:6px;font-weight:700;font-size:12px}
  .t-A{background:#00c853;color:#000}.t-B{background:#64dd17;color:#000}
  .t-C{background:#ffd600;color:#000}.t-D{background:#ff9100;color:#000}
  .t-E{background:#424242;color:#9d9da3}
  .score{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
  .s-premium{background:#00c853;color:#000}.s-good{background:#64dd17;color:#000}
  .s-low{background:#ffd600;color:#000}.s-poor{background:#e53935;color:#fff}.s-unproven{background:#424242;color:#9d9da3}
  .rm-tag{padding:1px 5px;border-radius:4px;font-size:10px;background:#e53935;color:#fff}
  .ss-img{width:210px;height:126px;object-fit:cover;border-radius:6px;background:#242426}
  .status{margin-top:8px;font-size:13px}
  .st-ok{color:#64dd17}.st-err{color:#e53935}.st-run{color:#ffd600}
  .hidden{display:none}.empty{text-align:center;padding:40px;color:#9d9da3}
  .hdr-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .dot{animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
  .log-panel{background:#0d0d0e;border-radius:8px;padding:12px;max-height:200px;overflow-y:auto;font-family:monospace;font-size:11px;margin-top:8px}
  .log-line{margin:1px 0;word-break:break-all}
  .log-err{color:#e53935}.log-warn{color:#ffd600}.log-info{color:#9d9da3}.log-ok{color:#64dd17}
  .log-btn-row{display:flex;gap:6px;margin-bottom:8px}
  .log-btn-row button{font-size:11px;padding:4px 10px}
</style>
</head>
<body>
<div class="container">
  <h1>Domains Parser v4</h1>
  <p class="sub">CrUX rank + screenshot + title/description</p>

  <div class="card">
    <textarea id="domainInput" rows="6" placeholder="yandex.ru&#10;mail.ru&#10;avito.ru&#10;..."></textarea>
    <div class="btn-row">
      <button class="btn-primary" id="btnAll" onclick="run(['rank','screenshot','meta'])">All</button>
      <button class="btn-secondary" onclick="run(['rank'])">Rank &amp; Score</button>
      <button class="btn-secondary" onclick="run(['screenshot'])">Screenshots</button>
      <button class="btn-secondary" onclick="run(['meta'])">Titles &amp; Desc</button>
      <span id="status" class="status hidden"></span>
    </div>
  </div>

  <div id="resultsPanel" class="card hidden" style="overflow-x:auto">
    <div class="hdr-row" style="margin-bottom:12px">
      <span style="color:#9d9da3;font-size:13px">
        Results: <strong id="counter">0/0</strong>
        (cached: <span id="cacheCount" style="color:#64dd17">0</span>,
         fresh: <span id="freshCount" style="color:#ffd600">0</span>,
         ss: <span id="ssCount" style="color:#2196f3">0</span>,
         meta: <span id="metaCount" style="color:#9c27b0">0</span>)
      </span>
      <button class="btn-secondary" onclick="exportCSV()">Export CSV</button>
    </div>
    <table>
      <thead><tr>
        <th>Domain</th><th>Name</th><th>Tier</th><th>Score</th><th>Screen</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="log-btn-row">
      <strong style="font-size:13px">Log</strong>
      <span style="color:#9d9da3;font-size:11px;flex:1" id="logSummary"></span>
      <button class="btn-secondary" onclick="copyLog()">Copy All</button>
      <button class="btn-danger" onclick="clearLog()">Clear</button>
    </div>
    <div class="log-panel" id="logPanel"></div>
  </div>
</div>

<script>
const SURL = "https://dcrmfvfuyexjdygbupwr.supabase.co/";
const SKEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjcm1mdmZ1eWV4amR5Z2J1cHdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjExNjYsImV4cCI6MjEwMjAzNzE2Nn0.lNe0cbwYq2yWV6tr__b6u5B9nZE2dgDk45j4KEoMhNI";

const log = { lines: [], errs: 0, warns: 0 };

function logLine(text, type) {
  const t = new Date().toLocaleTimeString();
  const entry = { time: t, text, type };
  log.lines.push(entry);
  if (type === "err") log.errs++;
  if (type === "warn") log.warns++;

  const el = document.getElementById("logPanel");
  const div = document.createElement("div");
  div.className = `log-line log-${type}`;
  div.textContent = `[${t}] ${text}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  document.getElementById("logSummary").textContent = `${log.errs} errors, ${log.warns} warnings`;
}

function copyLog() {
  const text = log.lines.map(l => `[${l.time}] [${l.type}] ${l.text}`).join("\n");
  navigator.clipboard.writeText(text).then(() => logLine("Log copied to clipboard", "ok"));
}

function clearLog() {
  log.lines = []; log.errs = 0; log.warns = 0;
  document.getElementById("logPanel").innerHTML = "";
  document.getElementById("logSummary").textContent = "";
}let state = { total: 0, entries: {}, counter: { rank: 0, screenshot: 0, meta: 0 }, processing: false, _idx: 0 };
const BATCH_SIZE = 30;

async function run(phases) {
  if (state.processing) return;
  const text = document.getElementById("domainInput").value.trim();
  if (!text) return;
  const allDomains = text.split("\n").map(l => l.trim()).filter(Boolean);

  state = { total: allDomains.length, entries: {}, counter: { rank: 0, screenshot: 0, meta: 0 }, processing: true, _idx: 0 };
  logLine(`START: ${allDomains.length} domains, phases=[${phases.join(",")}], batch=${BATCH_SIZE}`, "info");
  document.getElementById("resultsPanel").classList.remove("hidden");
  document.getElementById("tableBody").innerHTML = "";
  disableButtons(true);

  // Split into initial batches
  const queue = [];
  for (let i = 0; i < allDomains.length; i += BATCH_SIZE) {
    queue.push({ domains: allDomains.slice(i, i + BATCH_SIZE), size: BATCH_SIZE, retries: 0 });
  }

  let batchNo = 0;
  while (queue.length > 0) {
    batchNo++;
    const item = queue.shift();
    showStatus("run", `Batch ${batchNo} (${item.domains.length} domains, s=${item.size}): ${phases.join(", ")}...`);
    logLine(`Batch #${batchNo}: ${item.domains.length} domains, size=${item.size}, phases=[${phases.join(",")}]`, "info");
    updateCounter();

    const success = await processBatchWithTimeout(item.domains, phases);

    if (!success) {
      // Timeout — only retry domains without results yet
      const remaining = item.domains.filter(d => !state.entries[d]);
      if (remaining.length === 0) continue; // all processed despite timeout

      const half = Math.max(2, Math.floor(item.size / 2));
      // Split remaining into two
      const mid = Math.ceil(remaining.length / 2);
      const a = remaining.slice(0, mid);
      const b = remaining.slice(mid);
      if (b.length) queue.unshift({ domains: b, size: half, retries: 0 });
      if (a.length) queue.unshift({ domains: a, size: half, retries: 0 });
      showStatus("run", `Timeout: ${domains.length - remaining.length} done, ${remaining.length} retrying (s=${half})...`);
      logLine(`TIMEOUT: ${domains.length - remaining.length} ok, ${remaining.length} retry [${remaining.join(", ")}]`, "warn");
    }
  }

  disableButtons(false);
  showStatus("ok", `Done: ${Object.keys(state.entries).length} domains`);
  logLine(`DONE: ${Object.keys(state.entries).length}/${state.total} domains`, "ok");
}

async function processBatchWithTimeout(domains, phases) {
  const timeoutMs = 9000; // Edge Function kills at 10s, warn at 9s
  let gotDone = false;
  let lastEventTime = Date.now();

  try {
    const resp = await fetch(`${SURL.replace(/\/$/, "")}/functions/v1/process-entries`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SKEY, Authorization: `Bearer ${SKEY}` },
      body: JSON.stringify({ domains, phases }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await raceWithTimeout(reader.read(), 12000);

      if (done) break;

      if (value) {
        lastEventTime = Date.now();
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() || "";
        for (const line of lines) {
          if (line.startsWith("data: ")) {
            const data = JSON.parse(line.slice(6));
            if (data.type === "done") gotDone = true;
            handle(data);
          }
        }
      }

      // Check if we're approaching timeout
      if (Date.now() - lastEventTime > 5000) {
        reader.cancel();
        return gotDone;
      }
    }

    return gotDone;
  } catch (e) {
    logLine(`Fetch error: ${e}`, "err");
    const remaining = domains.filter(d => !state.entries[d]);
    if (remaining.length === 0) return true;
    return false;
  }
}

async function raceWithTimeout(promise, ms) {
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("TIMEOUT")), ms));
  try {
    return await Promise.race([promise, timeout]);
  } catch (e) {
    if (e.message === "TIMEOUT") return { done: true, value: null };
    throw e;
  }
}

function handle(data) {
  if (data.type === "done") return;
  if (data.type === "start") return; // ignore batch-level start

  if (data.type === "result") {
    state.entries[data.domain] = data.entry;
    const e = data.entry;
    if (data.phase === "rank" || data.phase === "base") {
      state.counter.rank++;
      if (e.crux_tier === "E" && e.entry_type === "website") logLine(`${data.domain}: tier=E (not in CrUX)`, "warn");
    }
    else if (data.phase === "screenshot") {
      state.counter.screenshot++;
      if (!e.screenshot_url) logLine(`${data.domain}: screenshot FAILED`, "err");
    }
    else if (data.phase === "meta") {
      state.counter.meta++;
      if (!e.name) logLine(`${data.domain}: meta FAILED`, "warn");
    }
    rerender();
  }
}

function updateCounter() {
  document.getElementById("counter").textContent = `${Object.keys(state.entries).length}/${state.total}`;
  document.getElementById("cacheCount").textContent = Object.values(state.entries).filter(e => e._source === "cache").length;
  document.getElementById("freshCount").textContent = Object.values(state.entries).filter(e => e._source === "fresh").length;
  document.getElementById("ssCount").textContent = state.counter.screenshot;
  document.getElementById("metaCount").textContent = state.counter.meta;
}

function rerender() {
  updateCounter();
  const arr = Object.values(state.entries).sort((a, b) => (a._idx ?? 999) - (b._idx ?? 999));
  // Add index for sorting
  Object.keys(state.entries).forEach((k, i) => { if (state.entries[k]._idx === undefined) state.entries[k]._idx = i; });

  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = arr.map(r => {
    const tier = r.crux_tier ?? "E";
    const score = r.quality_score ?? 0;
    const label = r.quality_label ?? "unproven";
    const rm = r.to_remove ? `<span class="rm-tag">del</span>` : "";
    const name = (r.name || "-").substring(0, 30);
    const desc = (r.description || "").substring(0, 60);
    const ss = r.screenshot_url ? `<a href="${r.screenshot_url}" target="_blank"><img class="ss-img" src="${r.screenshot_url}" alt=""></a>` : "";
    const metaLoading = r.entry_type === "website" && !r.name && !state.processingDone ? "" : "";
    return `<tr>
      <td><strong>${r.id}</strong> ${rm}<br><span style="color:#9d9da3;font-size:11px">${desc}${metaLoading}</span></td>
      <td>${name}</td>
      <td><span class="tier t-${tier}">${tier}</span></td>
      <td><span class="score s-${label}">${score} ${label}</span></td>
      <td>${ss}</td>
    </tr>`;
  }).join("");
}

function exportCSV() {
  const arr = Object.values(state.entries);
  if (!arr.length) return;
  const h = "domain,name,description,tier,rank_global,rank_ru,score,label,screenshot_url";
  const rows = arr.map(r => [r.id, r.name, r.description, r.crux_tier, r.crux_rank_global, r.crux_rank_ru, r.quality_score, r.quality_label, r.screenshot_url].map(v => `"${String(v || "").replace(/"/g, '""')}"`).join(","));
  const csv = h + "\n" + rows.join("\n");
  const b = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `report_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}

function disableButtons(v) {
  document.querySelectorAll(".btn-row button").forEach(b => b.disabled = v);
}

function showStatus(type, text) {
  const el = document.getElementById("status");
  el.className = `status st-${type === "run" ? "run" : type}`;
  el.textContent = text;
  el.classList.remove("hidden");
}
</script>
</body>
</html>
