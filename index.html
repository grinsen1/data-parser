<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0d0e">
<title>Domains Parser v4</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0d0e;color:#f5f5f5;padding:16px}
  .container{max-width:1000px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#9d9da3;margin:0 0 16px;font-size:13px}
  .card{background:#19191b;border-radius:12px;padding:16px;margin-bottom:16px}
  textarea{width:100%;background:#242426;color:#f5f5f5;border:none;border-radius:8px;padding:12px;font-family:monospace;font-size:13px;resize:vertical}
  button{padding:10px 18px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:600}
  .btn-primary{background:#f7bd19;color:#000}
  .btn-secondary{background:#242426;color:#f5f5f5}
  button:disabled{opacity:.4;cursor:default}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:#9d9da3;font-size:12px;padding:8px 6px;border-bottom:1px solid #2a2a2c}
  td{padding:8px 6px;border-bottom:1px solid #1a1a1c;font-size:13px;vertical-align:middle}
  .tier{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:6px;font-weight:700;font-size:12px}
  .t-A{background:#00c853;color:#000}.t-B{background:#64dd17;color:#000}
  .t-C{background:#ffd600;color:#000}.t-D{background:#ff9100;color:#000}
  .t-E{background:#424242;color:#9d9da3}
  .ss-img{width:180px;height:110px;object-fit:cover;border-radius:6px;background:#242426}
  .status{margin-top:10px;font-size:13px}
  .st-ok{color:#64dd17}.st-err{color:#e53935}.st-run{color:#ffd600}
  .hidden{display:none}
  .hdr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .progress-bar{height:4px;background:#242426;border-radius:2px;margin-bottom:12px;overflow:hidden}
  .progress-bar div{height:100%;background:#f7bd19;transition:width .3s}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;margin-right:4px}
  .p-done{background:#64dd17;color:#000}.p-pending{background:#424242;color:#9d9da3}
  .p-failed{background:#e53935;color:#fff}.p-leased{background:#ffd600;color:#000}
  .err{color:#e53935;font-size:11px}
  .thum{width:180px;height:110px;object-fit:cover;border-radius:6px;background:#242426;display:block}
</style>
</head>
<body>
<div class="container">
  <h1>Domains Parser v4</h1>
  <p class="sub">Серверная очередь: вставил список — Supabase сам собирает ранги, мету, скриншоты</p>

  <div class="card">
    <textarea id="domainInput" rows="6" placeholder="yandex.ru&#10;mail.ru&#10;avito.ru&#10;..."></textarea>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn-primary" id="btnSubmit" onclick="submitDomains()">Загрузить</button>
      <button class="btn-secondary" onclick="kickNow()">Обработать сейчас</button>
      <span id="status" class="status hidden"></span>
    </div>
  </div>

  <div id="resultsPanel" class="card hidden" style="overflow-x:auto">
    <div class="progress-bar"><div id="progress" style="width:0%"></div></div>
    <div class="hdr">
      <span style="color:#9d9da3;font-size:13px" id="progressText">—</span>
      <button class="btn-secondary" onclick="exportCSV()">Export CSV</button>
    </div>
    <table>
      <thead><tr>
        <th>Домен</th><th>Rank</th><th>Tier</th><th>Название</th><th>Скрин</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const SURL = "https://dcrmfvfuyexjdygbupwr.supabase.co/";
const SKEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjcm1mdmZ1eWV4amR5Z2J1cHdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjExNjYsImV4cCI6MjEwMjAzNzE2Nn0.lNe0cbwYq2yWV6tr__b6u5B9nZE2dgDk45j4KEoMhNI";

const H = { "Content-Type": "application/json", apikey: SKEY, Authorization: `Bearer ${SKEY}` };

let pollTimer = null;

function hdr() { return H; }

async function submitDomains() {
  const text = document.getElementById("domainInput").value.trim();
  if (!text) return;
  const domains = text.split("\n").map(l => l.trim().toLowerCase()).filter(Boolean);

  const btn = document.getElementById("btnSubmit");
  btn.disabled = true;
  showStatus("run", "Регистрирую домены...");

  try {
    const resp = await fetch(`${SURL.replace(/\/$/, "")}/rest/v1/rpc/register_domains`, {
      method: "POST",
      headers: hdr(),
      body: JSON.stringify({ p_domains: domains }),
    });
    if (!resp.ok) throw new Error(await resp.text());

    showStatus("ok", `Добавлено ${domains.length} доменов`);
    document.getElementById("resultsPanel").classList.remove("hidden");
    startPolling();
  } catch (e) {
    showStatus("err", "Ошибка: " + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function kickNow() {
  showStatus("run", "Запускаю воркеры...");
  const base = SURL.replace(/\/$/, "");
  for (const kind of ["rank", "meta", "screenshot"]) {
    try {
      await fetch(`${base}/functions/v1/workr`, {
        method: "POST", headers: hdr(),
        body: JSON.stringify({ kind, limit: 20 }),
      });
    } catch {}
  }
  showStatus("ok", "Воркеры запущены, ждём результат");
  document.getElementById("resultsPanel").classList.remove("hidden");
  startPolling();
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refresh, 2500);
  refresh();
}

async function refresh() {
  try {
    // Прогресс по задачам
    const [domains, tasks] = await Promise.all([
      fetch(`${SURL.replace(/\/$/, "")}/rest/v1/domains?select=*&order=domain`, { headers: hdr() }).then(r => r.json()),
      fetch(`${SURL.replace(/\/$/, "")}/rest/v1/tasks?select=kind,state&order=kind`, { headers: hdr() }).then(r => r.json()),
    ]);

    render(domains, tasks);
  } catch (e) {
    // тихо
  }
}

function tierOf(rank) {
  if (rank === null || rank === undefined) return "E";
  if (rank <= 1000) return "A";
  if (rank <= 50000) return "B";
  if (rank <= 500000) return "C";
  return "D";
}

function render(domains, tasks) {
  // Прогресс
  const total = tasks.length;
  const done = tasks.filter(t => t.state === "done").length;
  const failed = tasks.filter(t => t.state === "dead" || t.state === "no_data").length;

  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById("progress").style.width = pct + "%";
  document.getElementById("progressText").textContent =
    `${done}/${total} задач готово` + (failed ? `, ${failed} безнадёжных` : "");

  // Таблица
  const tbody = document.getElementById("tableBody");
  if (!domains.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="color:#9d9da3">Нет доменов</td></tr>';
    return;
  }

  tbody.innerHTML = domains.map(d => {
    const tier = tierOf(d.rank);
    const name = (d.title || "").substring(0, 40) || '<span style="color:#9d9da3">—</span>';
    const ss = d.screenshot_path
      ? `<img class="ss-img" src="${d.screenshot_path}" loading="lazy" alt="">`
      : '<span style="color:#9d9da3">—</span>';
    return `<tr>
      <td><strong>${d.domain}</strong></td>
      <td>${d.rank ?? '<span style="color:#9d9da3">—</span>'}</td>
      <td><span class="tier t-${tier}">${tier}</span></td>
      <td>${name}</td>
      <td>${ss}</td>
    </tr>`;
  }).join("");
}

function exportCSV() {
  fetch(`${SURL.replace(/\/$/, "")}/rest/v1/domains?select=*&order=domain`, { headers: hdr() })
    .then(r => r.json())
    .then(domains => {
      const h = "domain,rank,title,description,screenshot_path";
      const rows = domains.map(d => [d.domain, d.rank, d.title, d.description, d.screenshot_path]
        .map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(","));
      const b = new Blob([h + "\n" + rows.join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = `domains_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    });
}

function showStatus(type, text) {
  const el = document.getElementById("status");
  el.className = `status st-${type}`;
  el.textContent = text;
  el.classList.remove("hidden");
}
</script>
</body>
</html>
