<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0d0e">
<title>Domains Parser v4</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0d0e;color:#f5f5f5;padding:16px}
  .container{max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#9d9da3;margin:0 0 16px;font-size:13px}
  .card{background:#19191b;border-radius:12px;padding:16px;margin-bottom:16px}
  textarea{width:100%;background:#242426;color:#f5f5f5;border:none;border-radius:8px;padding:12px;font-family:monospace;font-size:13px;resize:vertical}
  button{padding:8px 16px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:600}
  .btn-primary{background:#f7bd19;color:#000}
  .btn-secondary{background:#242426;color:#f5f5f5}
  .btn-danger{background:#e53935;color:#fff}
  button:disabled{opacity:.4}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:#9d9da3;font-size:12px;padding:8px 6px;border-bottom:1px solid #2a2a2c}
  td{padding:8px 6px;border-bottom:1px solid #1a1a1c;font-size:13px;vertical-align:middle}
  .tier{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:6px;font-weight:700;font-size:12px}
  .t-A{background:#00c853;color:#000}.t-B{background:#64dd17;color:#000}
  .t-C{background:#ffd600;color:#000}.t-D{background:#ff9100;color:#000}
  .t-E{background:#424242;color:#9d9da3}
  .score{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
  .s-premium{background:#00c853;color:#000}.s-good{background:#64dd17;color:#000}
  .s-low{background:#ffd600;color:#000}.s-poor{background:#e53935;color:#fff}.s-unproven{background:#424242;color:#9d9da3}
  .rm-tag{padding:1px 5px;border-radius:4px;font-size:10px;background:#e53935;color:#fff}
  .ss-img{width:210px;height:126px;object-fit:cover;border-radius:6px;background:#242426}
  .status{margin-top:8px;font-size:13px}
  .st-ok{color:#64dd17}.st-err{color:#e53935}.st-run{color:#ffd600}
  .hidden{display:none}.empty{text-align:center;padding:40px;color:#9d9da3}
  .hdr-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .dot{animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
  .log-panel{background:#0d0d0e;border-radius:8px;padding:12px;max-height:200px;overflow-y:auto;font-family:monospace;font-size:11px;margin-top:8px}
  .log-line{margin:1px 0;word-break:break-all}
  .log-err{color:#e53935}.log-warn{color:#ffd600}.log-info{color:#9d9da3}.log-ok{color:#64dd17}
  .log-btn-row{display:flex;gap:6px;margin-bottom:8px}
  .log-btn-row button{font-size:11px;padding:4px 10px}
  .badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;margin-left:4px}
  .b-ok{background:#64dd17;color:#000}.b-run{background:#ffd600;color:#000}.b-err{background:#e53935;color:#fff}
</style>
</head>
<body>
<div class="container">
  <h1>Domains Parser v4</h1>
  <p class="sub">CrUX rank + screenshot (PageSpeed, fire & poll) + title/description</p>

  <div class="card">
    <textarea id="domainInput" rows="6" placeholder="yandex.ru&#10;mail.ru&#10;avito.ru&#10;..."></textarea>
    <div class="btn-row">
      <button class="btn-primary" id="btnAll" onclick="runAll()">All</button>
      <button class="btn-secondary" onclick="runRank()">Rank &amp; Score</button>
      <button class="btn-secondary" onclick="runScreenshots()">Screenshots</button>
      <button class="btn-secondary" onclick="runMeta()">Titles &amp; Desc</button>
      <span id="status" class="status hidden"></span>
    </div>
  </div>

  <div id="resultsPanel" class="card hidden" style="overflow-x:auto">
    <div class="hdr-row" style="margin-bottom:12px">
      <span style="color:#9d9da3;font-size:13px">
        Results: <strong id="counter">0/0</strong>
        (cached: <span id="cacheCount" style="color:#64dd17">0</span>,
         ss: <span id="ssCount" style="color:#2196f3">0</span>,
         meta: <span id="metaCount" style="color:#9c27b0">0</span>)
      </span>
      <button class="btn-secondary" onclick="exportCSV()">Export CSV</button>
    </div>
    <table>
      <thead><tr>
        <th>Domain</th><th>Name</th><th>Tier</th><th>Score</th><th>Screen</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="log-btn-row">
      <strong style="font-size:13px">Log</strong>
      <span style="color:#9d9da3;font-size:11px;flex:1" id="logSummary"></span>
      <button class="btn-secondary" onclick="copyLog()">Copy All</button>
      <button class="btn-danger" onclick="clearLog()">Clear</button>
    </div>
    <div class="log-panel" id="logPanel"></div>
  </div>
</div>

<script>
const SURL = "https://dcrmfvfuyexjdygbupwr.supabase.co/";
const SKEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjcm1mdmZ1eWV4amR5Z2J1cHdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjExNjYsImV4cCI6MjEwMjAzNzE2Nn0.lNe0cbwYq2yWV6tr__b6u5B9nZE2dgDk45j4KEoMhNI";

const R = {}; // global results { domain: entry }
let domains = [];
let busy = false;

function hdr() { return { "Content-Type": "application/json", apikey: SKEY, Authorization: `Bearer ${SKEY}` }; }

// === LOGGING ===
const log = { lines: [], errs: 0, warns: 0 };
function logLine(text, type) {
  const t = new Date().toLocaleTimeString();
  log.lines.push({ time: t, text, type });
  if (type === "err") log.errs++;
  if (type === "warn") log.warns++;
  const el = document.getElementById("logPanel"), div = document.createElement("div");
  div.className = `log-line log-${type}`;
  div.textContent = `[${t}] ${text}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  document.getElementById("logSummary").textContent = `${log.errs} errors, ${log.warns} warnings`;
}
function copyLog() {
  const t = log.lines.map(l => `[${l.time}] [${l.type}] ${l.text}`).join("\n");
  navigator.clipboard.writeText(t).then(() => logLine("Log copied", "ok"));
}
function clearLog() {
  log.lines = []; log.errs = 0; log.warns = 0;
  document.getElementById("logPanel").innerHTML = "";
  document.getElementById("logSummary").textContent = "";
}

// === HELPERS ===
function getDomains() {
  return document.getElementById("domainInput").value.trim().split("\n").map(l => l.trim()).filter(Boolean);
}
function showStatus(type, text) {
  const el = document.getElementById("status");
  el.className = `status st-${type === "run" ? "run" : type}`;
  el.textContent = text;
  el.classList.remove("hidden");
}
function disableButtons(v) { document.querySelectorAll(".btn-row button").forEach(b => b.disabled = v); }

// === RENDER ===
function render() {
  const arr = domains.map(d => R[d]).filter(Boolean);
  const c = document.getElementById("counter");
  c.textContent = `${arr.length}/${domains.length}`;

  const cached = arr.filter(e => e._source === "cache").length;
  document.getElementById("cacheCount").textContent = cached;

  const ssOk = arr.filter(e => e.screenshot_url).length;
  document.getElementById("ssCount").textContent = ssOk;

  const metaOk = arr.filter(e => e.name && e.description).length;
  document.getElementById("metaCount").textContent = metaOk;

  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = arr.map(e => {
    const tier = e.crux_tier ?? "E";
    const score = e.quality_score ?? 0;
    const label = e.quality_label ?? "unproven";
    const rm = e.to_remove ? `<span class="rm-tag">del</span>` : "";
    const name = (e.name || "-").substring(0, 30);
    const desc = (e.description || "").substring(0, 60);
    const ss = e.screenshot_url
      ? `<a href="${e.screenshot_url}" target="_blank"><img class="ss-img" src="${e.screenshot_url}" alt=""></a>`
      : (e.ssPending ? `<span class="badge b-run">ss...</span>` : "");
    const meta = !e.name && e.metaPending ? `<span class="badge b-run">meta...</span>` : "";
    return `<tr>
      <td><strong>${e.id}</strong> ${rm}${meta}<br><span style="color:#9d9da3;font-size:11px">${desc}</span></td>
      <td>${name}</td>
      <td><span class="tier t-${tier}">${tier}</span></td>
      <td><span class="score s-${label}">${score} ${label}</span></td>
      <td>${ss}</td>
    </tr>`;
  }).join("");
}

// === PHASE 1: RANK (JSON response, no SSE) ===
async function runRank() {
  if (busy) return;
  domains = getDomains();
  if (!domains.length) return;
  busy = true; disableButtons(true);
  document.getElementById("resultsPanel").classList.remove("hidden");
  document.getElementById("tableBody").innerHTML = "";
  for (const d of domains) if (!R[d]) R[d] = { id: d };
  render();
  showStatus("run", "Rank...");
  logLine(`Rank: ${domains.length} domains`, "info");

  const BATCH = 30;
  for (let i = 0; i < domains.length; i += BATCH) {
    const batch = domains.slice(i, i + BATCH);
    try {
      const resp = await fetch(`${SURL.replace(/\/$/, "")}/functions/v1/process-entries`, {
        method: "POST", headers: hdr(),
        body: JSON.stringify({ domains: batch, phases: ["rank"] }),
      });
      const data = await resp.json();
      for (const e of data.results ?? []) { R[e.id] = e; }
      render();
      showStatus("run", `Rank: ${Math.min(i+BATCH,domains.length)}/${domains.length}`);
    } catch (e) {
      logLine(`Rank batch ${i} failed: ${e}`, "err");
    }
  }
  busy = false; disableButtons(false);
  showStatus("ok", `Rank done: ${Object.keys(R).filter(k => R[k]?.crux_tier).length} domains`);
}

// === PHASE 2: SCREENSHOTS (fire & poll) ===
async function runScreenshots() {
  if (busy) return;
  domains = getDomains();
  if (!domains.length) return;
  // Ensure we have rank data first
  if (!R[domains[0]]?.crux_tier) await runRankSequence();
  busy = true; disableButtons(true);
  showStatus("run", "Screenshots...");
  logLine(`Screenshots: ${domains.length} domains`, "info");

  const toShot = domains.filter(d => {
    const e = R[d];
    return e && e.crux_tier !== "E" && !e.screenshot_url;
  });
  if (!toShot.length) { showStatus("ok", "No screenshots needed"); busy = false; disableButtons(false); return; }

  logLine(`Screenshots to fetch: ${toShot.length}`, "info");

  for (const d of toShot) { R[d].ssPending = true; }
  render();

  const POLL_EVERY = 5000;
  const MAX_POLLS = 16;
  const baseUrl = SURL.replace(/\/$/, "");

  // Fire all
  await Promise.all(toShot.map(async d => {
    try {
      const resp = await fetch(`${baseUrl}/functions/v1/screenshot`, {
        method: "POST", headers: hdr(),
        body: JSON.stringify({ domain: d }),
      });
      const j = await resp.json();
      if (j.cached && j.url) {
        R[d].screenshot_url = j.url;
        R[d].ssPending = false;
        logLine(`${d}: screenshot CACHED`, "ok");
      } else if (j.pending) {
        logLine(`${d}: screenshot FIRED`, "info");
      }
    } catch (e) { logLine(`${d}: FIRE failed: ${e}`, "err"); }
  }));
  render();

  // Poll Storage
  for (let poll = 0; poll < MAX_POLLS; poll++) {
    const still = toShot.filter(d => !R[d].screenshot_url);
    if (!still.length) break;
    await new Promise(r => setTimeout(r, POLL_EVERY));

    await Promise.all(still.map(async d => {
      try {
        const resp = await fetch(`${baseUrl}/functions/v1/screenshot`, {
          method: "POST", headers: hdr(),
          body: JSON.stringify({ domain: d }),
        });
        const j = await resp.json();
        if (j.url) {
          R[d].screenshot_url = j.url;
          R[d].ssPending = false;
          logLine(`${d}: screenshot READY (poll ${poll + 1})`, "ok");
        }
      } catch { /* poll continues */ }
    }));
    render();
  }

  // Mark remaining as failed
  for (const d of toShot) {
    if (!R[d].screenshot_url) {
      R[d].ssPending = false;
      logLine(`${d}: screenshot FAILED`, "err");
    }
  }
  render();

  busy = false; disableButtons(false);
  showStatus("ok", `Screenshots done`);
}

// === PHASE 3: META (fast per-domain fetch) ===
async function runMeta() {
  if (busy) return;
  domains = getDomains();
  if (!domains.length) return;
  if (!R[domains[0]]?.crux_tier) await runRankSequence();
  busy = true; disableButtons(true);
  showStatus("run", "Meta...");
  logLine(`Meta: ${domains.length} domains`, "info");

  const toMeta = domains.filter(d => {
    const e = R[d];
    return e && e.entry_type === "website" && (!e.name || !e.description);
  });

  for (const d of toMeta) { R[d].metaPending = true; }
  render();

  // 5 parallel via Edge Function
  const CONC = 5;
  const baseUrl = SURL.replace(/\/$/, "");
  for (let i = 0; i < toMeta.length; i += CONC) {
    const chunk = toMeta.slice(i, i + CONC);
    await Promise.all(chunk.map(async d => {
      try {
        const resp = await fetch(`${baseUrl}/functions/v1/meta`, {
          method: "POST", headers: hdr(),
          body: JSON.stringify({ domain: d }),
        });
        const { name, description } = await resp.json();
        if (name) R[d].name = name;
        if (description) R[d].description = description;
        R[d].metaPending = false;
        logLine(`${d}: meta OK (name=${(name || "").substring(0, 20)})`, "ok");
      } catch (e) {
        R[d].metaPending = false;
        logLine(`${d}: meta failed: ${e}`, "err");
      }
    }));
    render();
  }

  busy = false; disableButtons(false);
  showStatus("ok", `Meta done`);
}

// === ALL ===
async function runAll() {
  await runRank();
  await new Promise(r => setTimeout(r, 500));
  await Promise.all([runScreenshots(), runMeta()]);
}

async function runRankSequence() {
  try {
    const resp = await fetch(`${SURL.replace(/\/$/, "")}/functions/v1/process-entries`, {
      method: "POST", headers: hdr(),
      body: JSON.stringify({ domains, phases: ["rank"] }),
    });
    const data = await resp.json();
    for (const e of data.results ?? []) R[e.id] = e;
    render();
  } catch {}
}

// === Export ===
function exportCSV() {
  const arr = domains.map(d => R[d]).filter(Boolean);
  if (!arr.length) return;
  const h = "domain,name,description,tier,rank_global,rank_ru,score,label,screenshot_url";
  const rows = arr.map(r => [r.id, r.name, r.description, r.crux_tier, r.crux_rank_global, r.crux_rank_ru, r.quality_score, r.quality_label, r.screenshot_url].map(v => `"${String(v || "").replace(/"/g, '""')}"`).join(","));
  const b = new Blob([h + "\n" + rows.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `report_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}
</script>
</body>
</html>
